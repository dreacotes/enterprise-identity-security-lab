name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
  
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t enterprise-identity-api:ci .
      
      - name: Start API container
        run: docker run -d --name identity-api -p 127.0.0.1:8000:8000 enterprise-identity-api:ci

      - name: Check health endpoint
        shell: bash
        run: |
          ready=false

          for attempt in {1..15}; do
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:8000/health \
              -o health.json; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "API did not become ready"
            exit 1
          fi

          python3 -c 'import json; data = json.load(open("health.json")); assert data == {"status": "ok"}, data'

      - name: Show container logs
        if: always()
        run: docker logs identity-api

      - name: Remove API container
        if: always()
        run: docker rm -f identity-api